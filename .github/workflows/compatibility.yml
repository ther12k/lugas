name: Compatibility

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        bun: ["1.4.0", "1.4.x"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ matrix.bun }}
      - run: bun install --frozen-lockfile
      # M6-006-EH (#294): record the EXACT resolved Bun version and runner
      # identity per cell so "latest patch" has a concrete audited value.
      # Portable across bash/pwsh runners: write via the Actions expression,
      # not shell interpolation of $SUMMARY (null on Windows pwsh).
      - run: echo "cell bun=$(bun --version) os=${{ runner.os }} arch=${{ runner.arch }}" >> "$GITHUB_STEP_SUMMARY"
        shell: bash
      # M6-006: the user-facing table must never drift from the matrix source.
      - run: bun run verify:compatibility-report
      - run: bun run typecheck
      - run: bun test tests/unit/ tests/conformance/
      # M6-006-EH (#294): CLI is process/spawn-heavy — verify it per platform.
      - run: bun test tests/cli/ --timeout 30000
      - run: bun test tests/security/ --timeout 30000

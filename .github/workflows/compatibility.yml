name: Compatibility

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        bun: ["1.4.0", "1.4.x"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ matrix.bun }}
      - run: bun install --frozen-lockfile
      # M6-006: the user-facing table must never drift from the matrix source.
      - run: bun run verify:compatibility-report
      - run: bun run typecheck
      - run: bun test tests/unit/ tests/conformance/
      - run: bun test tests/security/ --timeout 30000
